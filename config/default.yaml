# Bookworm default configuration.
# Rig-specific values (poses, calibration) are written to config/local.yaml
# (git-ignored) by the calibration commands and override this file.
#
# Units: millimetres, degrees. World frame = Viam "world" frame (arm base).

robot:
  backend: viam             # viam | mock   (Viam credentials come from .env)
  arm: arm                  # uFactory arm component name in the Viam app
  gripper: gripper
  camera: cam               # RGB-D wrist camera; in the Viam frame system with the arm as parent
  # Fixed overhead camera instead (e.g. a phone via a Mac sub-part, Viam `webcam` model)?
  #   camera: phone-cam, camera_calibrated: false, then run `python -m bookworm calibrate-view`
  #   once, and save the `overview` pose as an arm position that is OUT of the camera's view.
  camera_calibrated: true   # true = intrinsics + frame system available -> exact page geometry
  # Distance from the arm flange (what Viam's arm pose refers to) to the eraser tip,
  # along the tool axis. Measure with the pencil in its 3D-printed holder.
  tool_length_mm: 190
  # Tool orientation for every pencil move: straight down.
  tip_orientation: {o_x: 0, o_y: 0, o_z: -1, theta: 0}
  safe_height_mm: 80        # height above the page for travel between moves

# Arm flange poses in the world frame {x, y, z, o_x, o_y, o_z, theta}.
# Jog the arm (Viam CONTROL tab or uFactory freedrive), then:
#   python -m bookworm save-pose <name>
poses:
  home: null
  overview: null            # whole open spread in view       (read mode)
  scan_left: null           # left page fills the frame       (scan mode)
  scan_right: null          # right page fills the frame      (scan mode)

# Book frame, recorded by touching the eraser tip to 3 points:
#   python -m bookworm calibrate-book
#   origin       = bottom end of the spine (on the page surface)
#   x axis       = toward the right page's outer edge
#   y axis       = up the spine toward the top of the book
#   z            = world up; z = 0 is the surface of the right-hand page stack
book:
  spine_bottom: null        # [x, y, z] eraser-tip position, world mm
  spine_top: null
  right_corner: null        # bottom outer corner of the right page
  page_width_mm: 140
  page_height_mm: 210
  z_drop_per_flip_mm: 0.1   # right stack gets thinner as leaves move to the left

modes:
  read:
    shots: [{pose: overview, region: spread}]
    px_per_mm: 6            # warp resolution, enough for OCR
    read_order: [left, right]
    max_words_per_page: 30  # demo-friendly: read the first few sentences only (null = whole page)
  scan:
    shots: [{pose: scan_left, region: left}, {pose: scan_right, region: right}]
    px_per_mm: 12           # ~300 dpi archival scan
    save_color: true

vision:
  # Fallback when camera geometry is unavailable (mock / --images photos):
  # four corners of the spread in the raw image, TL, TR, BR, BL (pixels). null = full frame.
  book_corners: null        # (in the frame AFTER `rotate`)
  rotate: 0                 # fixed camera mounted sideways? rotate frames upright: 0 | 90 | 180 | 270 (clockwise)
  fallback_warp_size: [1600, 1100]   # output size when warping to book_corners (calibrate-view sets it)
  min_sharpness: 30.0       # variance-of-Laplacian; below = blurry, recapture (real page frames: ~40-60)
  max_capture_retries: 3
  settle_s: 0.5             # pause after arm moves before capturing (vibration)
  # Page holders hide text. Print them in a colour that never appears in books
  # and they are masked automatically (HSV, OpenCV H 0-179). null disables.
  clamp_color_hsv: [[40, 80, 60], [85, 255, 255]]   # bright green
  clamp_masks: []           # extra fixed rectangles [x0, y0, x1, y1], normalised spread coords
  # Pencil/gripper mask in wrist-camera pixels (the tool is fixed relative to the camera).
  # Build with: python -m bookworm calibrate-tool-mask   (writes the path into config/local.yaml)
  tool_mask: null
  ocr_input: gray           # gray (flatten + sharpen, Tesseract binarises) | binary (our adaptive threshold)
  page_number_region: 0.08  # bottom/top fraction of each page searched for page number
  corner_search_mm: 25      # vision corner must be within this of the calibrated corner
  # Fold / bad-flip detector (python -m bookworm watch-flip). Standalone: watches, never moves the arm.
  flip_monitor:
    reference_dir: config/flip_reference   # good/ and bad/ recordings (commit them: shared rig)
    max_deviation: 0.2      # distance from the nearest GOOD frame above which a frame is "odd"
    stop_after: 3           # consecutive odd frames before STOP

ocr:
  lang: eng
  psm: 3                    # tesseract page segmentation mode (3 = auto, 6 = single block)
  min_word_conf: 50
  min_page_conf: 55         # page mean confidence below this => "could not read"
  min_words_for_text: 5     # fewer words than this => blank page

verify:
  change_threshold: 0.08    # normalised image difference that counts as "page changed"
  max_flip_retries: 2

speech:
  engine: system            # system (macOS `say` / Linux espeak-ng, spoken in background) | print
  rate: 170                 # words per minute
  voice: null               # e.g. "Samantha" on macOS (`say -v '?'` lists voices)

flip:
  use_vision_corner: true   # refine the page corner from the image before each flip
  # Pencil-eraser flip as waypoints in the BOOK frame (mm). Tune on the rig — no code changes.
  #   move:    {x, y, z, from: corner|spine}   corner = detected bottom-outer corner of right page
  #            z is above the right page surface; small negative z = press (spring holder absorbs)
  #   gripper: {action: open|grab}
  #   wait:    {s: seconds}
  # Starting point only: press near the corner, drag toward the spine so the leaf
  # buckles up, slip the eraser under the raised corner, then carry it over the spine.
  sequence:
    - {move: {x: -20, y: 20, z: 30, from: corner}}   # hover inside the corner
    - {move: {x: -20, y: 20, z: -2, from: corner}}   # press eraser onto the leaf
    - {move: {x: -50, y: 20, z: -2, from: corner}}   # drag toward spine -> corner buckles up
    - {wait: {s: 0.3}}
    - {move: {x: -50, y: 20, z: 6,  from: corner}}   # ease off, keep the buckle
    - {move: {x: 5,   y: 20, z: 6,  from: corner}}   # slide outward under the raised corner
    - {move: {x: 5,   y: 20, z: 60, from: corner}}   # lift the leaf
    - {move: {x: 0,   y: 60, z: 120, from: spine}}   # carry over the spine
    - {move: {x: -100, y: 60, z: 40, from: spine}}   # lay it on the left
    - {move: {x: -100, y: 60, z: 80, from: spine}}   # retreat up

run:
  blank_spreads_to_stop: 2  # consecutive blank spreads => end of book
  save_dir: runs            # every capture + OCR text saved here for debugging
