# Bookworm default configuration.
# Rig-specific values (poses, calibration) are written to config/local.yaml
# (git-ignored) by the calibration commands and override this file.
#
# Units: millimetres, degrees. World frame = Viam "world" frame (arm base).

robot:
  backend: viam             # viam | mock   (Viam credentials come from .env)
  arm: arm                  # uFactory arm component name in the Viam app
  gripper: gripper
  camera: cam               # RGB-D wrist camera; in the Viam frame system with the arm as parent
  # Fixed overhead camera instead (e.g. a phone via a Mac sub-part, Viam `webcam` model)?
  #   camera: phone-cam, camera_calibrated: false, then run `python -m bookworm calibrate-view`
  #   once, and save the `overview` pose as an arm position that is OUT of the camera's view.
  camera_calibrated: true   # true = intrinsics + frame system available -> exact page geometry
  # Distance from the arm flange (what Viam's arm pose refers to) to the eraser tip,
  # along the tool axis. Measure with the pencil in its 3D-printed holder.
  tool_length_mm: 190
  # Tool orientation for every pencil move: straight down.
  tip_orientation: {o_x: 0, o_y: 0, o_z: -1, theta: 0}
  safe_height_mm: 80        # height above the page for travel between moves

# Arm flange poses in the world frame {x, y, z, o_x, o_y, o_z, theta}.
# Jog the arm (Viam CONTROL tab or uFactory freedrive), then:
#   python -m bookworm save-pose <name>
poses:
  home: null
  overview: null            # whole open spread in view       (read mode)
  scan_left: null           # left page fills the frame       (scan mode)
  scan_right: null          # right page fills the frame      (scan mode)

# Book frame, recorded by touching the eraser tip to 3 points:
#   python -m bookworm calibrate-book
#   origin       = bottom end of the spine (on the page surface)
#   x axis       = toward the right page's outer edge
#   y axis       = up the spine toward the top of the book
#   z            = world up; z = 0 is the surface of the right-hand page stack
book:
  spine_bottom: null        # [x, y, z] eraser-tip position, world mm
  spine_top: null
  right_corner: null        # bottom outer corner of the right page
  page_width_mm: 140
  page_height_mm: 210
  z_drop_per_flip_mm: 0.1   # right stack gets thinner as leaves move to the left

modes:
  read:
    shots: [{pose: overview, region: spread}]
    px_per_mm: 6            # warp resolution, enough for OCR
    read_order: [left, right]
    frames: 1               # frames OCR'd for Read/Summarise (1 = fastest; scan uses ocr.frames + voting)
    style: clean            # clean: only near-perfect sentences (chosen 2026-10-17); from_top: from the top, in order
                            # clean: only near-perfect sentences (for poor OCR; skips around the page)
    max_words: 60           # from_top: words per Read / per "continue" (finishes the sentence)
    max_words_per_page: 30  # clean: a few sentences per page
    min_sentence_quality: 0.95  # clean: only read sentences whose words are ~all real words
  scan:
    shots: [{pose: scan_left, region: left}, {pose: scan_right, region: right}]
    px_per_mm: 12           # ~300 dpi archival scan
    save_color: true
    searchable_pdf: true    # book.pdf gets an invisible OCR text layer (search / copy / reuse the text)

vision:
  # Fallback when camera geometry is unavailable (mock / --images photos):
  # four corners of the spread in the raw image, TL, TR, BR, BL (pixels). null = full frame.
  auto_corners: true        # find the book in every frame (survives a bumped camera); book_corners = fallback
  book_corners: null        # (in the frame AFTER `rotate`)
  rotate: 0                 # fixed camera mounted sideways? rotate frames upright: 0 | 90 | 180 | 270 (clockwise)
  fallback_warp_size: [1600, 1100]   # output size when warping to book_corners (calibrate-view sets it)
  min_sharpness: 30.0       # variance-of-Laplacian; below = blurry, recapture (real page frames: ~40-60)
  max_capture_retries: 3
  settle_s: 0.5             # pause after arm moves before capturing (vibration)
  # Page holders hide text. Print them in a colour that never appears in books
  # and they are masked automatically (HSV, OpenCV H 0-179). null disables.
  clamp_color_hsv: [[40, 80, 60], [85, 255, 255]]   # bright green
  clamp_masks: []           # extra fixed rectangles [x0, y0, x1, y1], normalised spread coords
  # Pencil/gripper mask in wrist-camera pixels (the tool is fixed relative to the camera).
  # Build with: python -m bookworm calibrate-tool-mask   (writes the path into config/local.yaml)
  tool_mask: null
  ocr_input: gray           # gray (flatten + sharpen, Tesseract binarises) | binary (our adaptive threshold)
  page_number_region: 0.12  # top/bottom fraction of each page searched for the page number
  corner_search_mm: 25      # vision corner must be within this of the calibrated corner
  # Fold / bad-flip detector (python -m bookworm watch-flip). Standalone: watches, never moves the arm.
  flip_monitor:
    reference_dir: config/flip_reference   # good/ and bad/ recordings (commit them: shared rig)
    max_deviation: 0.2      # distance from the nearest GOOD frame above which a frame is "odd"
    stop_after: 3           # consecutive odd frames before STOP

ocr:
  engine: auto              # auto (Apple Vision on macOS, else Tesseract) | apple | tesseract
  frames: 3                 # read N video frames per page (1 = single frame)
  combine: vote             # vote = word-by-word majority across frames | best = keep the cleanest frame
  frame_gap_s: 0.3          # pause between those frames
  lang: eng
  psm: 3                    # tesseract page segmentation mode (3 = auto, 6 = single block)
  min_word_conf: 50
  min_page_conf: 55         # page mean confidence below this => "could not read"
  min_words_for_text: 5     # fewer words than this => blank page

verify:
  change_threshold: 0.08    # normalised image difference that counts as "page changed"
  max_flip_retries: 2

speech:
  # auto = ElevenLabs when ELEVENLABS_API_KEY is in .env, else the system voice.
  # system = macOS `say` / Linux espeak-ng. print = no audio. Too slow? set engine: system.
  engine: auto
  rate: 170                 # system voice: words per minute
  voice: null               # system voice, e.g. "Samantha" (`say -v '?'` lists voices)
  elevenlabs:
    voice_id: Hd8mWkf5kvyBZB0S7yXU   # any voice id from elevenlabs.io (Voices -> "..." -> Copy voice ID)
    model: eleven_flash_v2_5         # their lowest-latency model
    timeout_s: 4                     # wait this long for a clip, then use the system voice

flip:
  use_vision_corner: true   # refine the page corner from the image before each flip
  # Pencil-eraser flip as waypoints in the BOOK frame (mm). Tune on the rig — no code changes.
  #   move:    {x, y, z, from: corner|spine}   corner = detected bottom-outer corner of right page
  #            z is above the right page surface; small negative z = press (spring holder absorbs)
  #   gripper: {action: open|grab}
  #   wait:    {s: seconds}
  # Starting point only: press near the corner, drag toward the spine so the leaf
  # buckles up, slip the eraser under the raised corner, then carry it over the spine.
  sequence:
    - {move: {x: -20, y: 20, z: 30, from: corner}}   # hover inside the corner
    - {move: {x: -20, y: 20, z: -2, from: corner}}   # press eraser onto the leaf
    - {move: {x: -50, y: 20, z: -2, from: corner}}   # drag toward spine -> corner buckles up
    - {wait: {s: 0.3}}
    - {move: {x: -50, y: 20, z: 6,  from: corner}}   # ease off, keep the buckle
    - {move: {x: 5,   y: 20, z: 6,  from: corner}}   # slide outward under the raised corner
    - {move: {x: 5,   y: 20, z: 60, from: corner}}   # lift the leaf
    - {move: {x: 0,   y: 60, z: 120, from: spine}}   # carry over the spine
    - {move: {x: -100, y: 60, z: 40, from: spine}}   # lay it on the left
    - {move: {x: -100, y: 60, z: 80, from: spine}}   # retreat up

llm:
  # OpenRouter (key: OPENROUTER_API_KEY in .env). Any vision model id from openrouter.ai/models.
  model: google/gemini-2.5-flash
  timeout_s: 20
  summary_sentences: 2
  cameras:                  # Viam camera per vlm-check (--live); --camera overrides
    lift: webcam            # side camera at table height: sees the page edges / leaves lifting
    holder: phone-cam       # overhead: page flat and in the holder

ui:
  # v1 | v2: the Flip button plays that recorded path (scripts/flip_path.py) over the page's
  # own robot connection. null = run flip_command instead.
  flip_path: null
  # true: the recorded path follows the book (moved/turned since it was taught), from the workshop GUI's
  # calibration (data/book_frame.json) and the reference set with scripts/flip_path.py --set-reference.
  # No reference yet, or the book hasn't moved: the recorded joints play exactly as taught.
  flip_dynamic: false
  # Command the Flip button runs when flip_path is null, e.g. a teammate's script:
  # "python scripts/flip.py --once". null = python -m bookworm flip (with the same --config).
  flip_command: null
  verify_flip: false        # ON HOLD (2026-10-17): true = after each flip, check with the camera that the page turned
  flip_retries: 2           # if it didn't: "Oops, let me try again" up to this many more times

run:
  blank_spreads_to_stop: 2  # consecutive blank spreads => end of book
  save_dir: runs            # every capture + OCR text saved here for debugging

gui:                        # local dev GUI (python -m bookworm gui). Setup: 1 home & level, 2 first capture, 3 depth scan, 4 z link, 5 book model, 6 touch demo
  probe:
    tool_length_mm: 155     # THE manual setting: tool tip below the flange (fingertips; change it when a pencil is fitted). Also on the Setup tab
    slow_deg_s: 20          # arm speed for every Setup motion
    restore_deg_s: 60       # speed put back afterwards (matches the xArm fragment)
  page_plane_z_mm: 35       # page z assumed only before there is a depth map (for drawing the points)
  tip_min_z_mm: 25          # tool-tip floor until the z link has measured the table; after that the floor is the table + 1 mm
  limits:                   # arm flange limits for jog and every move, world mm (Arm Farm: walls x=740, y=+-500; ceiling z=1050)
    x: [-400, 650]
    y: [-450, 450]
    z: [120, 600]
  depth:                    # measured values (table_slope, arm_offset_mm, ...) are written to config/local.yaml by the stages
    arm_offset_mm: 0        # the table top's z in the arm frame: measured by stage 4 (z link)
    scan_mode: pass         # stage 3: pass = views around the book's midpoint at home height; home = one view, no motion
    pass_offsets_mm:        # camera-pass views: (dx, dy) around the book midpoint (from the first capture) at home height;
      - [0, 0]              # refused moves are skipped
      - [70, 0]
      - [-70, 0]
      - [0, 80]
      - [0, -80]
    height_settle_s: 0.4    # touch ladders: wait after each step before reading the pose and the load
    height_step_wait_s: 1.2 # z link: time to press "It's touching" at each step (the press is the fallback to the load)
    z_link_search_below_mm: 10  # the z link lowers the tip at most this far below the expected table z
    z_link_book_clear_mm: 80    # the auto-picked table spot is at least this far from the book (an open finger reaches ~45 mm)
    step_drop:              # contact detection in every touch ladder (z link and demo)
      enabled: true
      mode: regression      # regression = a step whose joint load (or real position) leaves the trend of the steps before it.
                            # fixed = position only: on the xArm the read-back follows the command even when pushing, so it misses contact
      load_joints: [1, 2]   # 0-based joints whose load is watched: the xArm6's joints 2 and 3 carry a downward push
      load_floor: 0.3       # noise floor of the load reading (Nm); free-air steps vary by ~0.05 Nm on those joints
      load_k: 8.0           # contact: the load is this many standard deviations off its trend (the real hit on 2026-10-17 scored 466)
      k: 5.0                # contact: the tip landed this many standard deviations above its trend...
      pos_floor_mm: 0.3     # ...and at least this far
      min_drop_mm: 1.0      # fixed rule: a 2 mm step that goes down less than this
      use_load: true        # read the joint torque each step (xArm module DoCommand "load")
    record_views: true      # save every real depth view to data/depth/raw/ for offline replay (gui --replay)
