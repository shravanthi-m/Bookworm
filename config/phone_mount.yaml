# Fixed overhead phone (Continuity Camera) via the `shrav-mac` Viam sub-part.
# Use:  python -m bookworm --config config/phone_mount.yaml <command>
#
# rotate / book_corners were measured from a 1920x1080 recording at this mount
# (runs/IMG_2531.MOV). Re-check on the live feed once:  calibrate-view  (writes local.yaml;
# copy the result here if it differs). The book must not move after this.
robot:
  camera: phone-cam
  camera_calibrated: false

vision:
  rotate: 270
  book_corners: [[690, 0], [1660, 0], [1665, 800], [650, 785]]   # TL TR BR BL, after rotate
  fallback_warp_size: [975, 800]

modes:
  read:
    shots: [{pose: overview, region: spread}]   # overview = arm parked out of the phone's view
  scan:
    shots: [{pose: overview, region: spread}]
