<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bookworm</title>
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1b; --muted: #8a8780; --line: #dcd9d2; --accent: #2f5d50; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { display: grid; grid-template-columns: 1fr 240px; gap: 24px; padding: 24px; max-width: 1400px; margin: auto; }
  /* title + a little pink worm inching back and forth under it */
  .brand { position: relative; display: inline-block; margin: 0 0 18px; padding-bottom: 14px; }
  h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: .01em; }
  .worm { position: absolute; left: 0; bottom: 0; display: flex; align-items: flex-end;
          animation: crawl 9s ease-in-out infinite; }
  .worm i { width: 9px; height: 9px; margin-right: -3px; border-radius: 50%; background: #f4a3c0;
            animation: inch .9s ease-in-out infinite; }
  .worm i:nth-child(2) { animation-delay: .1s; } .worm i:nth-child(3) { animation-delay: .2s; }
  .worm i:nth-child(4) { animation-delay: .3s; }
  .worm b { position: relative; width: 11px; height: 11px; border-radius: 50%; background: #ee7fa8;
            animation: inch .9s ease-in-out infinite .4s; }
  .worm b::after { content: ""; position: absolute; width: 2.5px; height: 2.5px; border-radius: 50%;
                   background: #3a2a30; top: 3px; right: 2.5px; }
  @keyframes inch { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  @keyframes crawl {
    0%   { transform: translateX(0) scaleX(1); }
    46%  { transform: translateX(calc(var(--w) - 46px)) scaleX(1); }
    50%  { transform: translateX(calc(var(--w) - 46px)) scaleX(-1); }
    96%  { transform: translateX(0) scaleX(-1); }
    100% { transform: translateX(0) scaleX(1); }
  }
  @media (prefers-reduced-motion: reduce) { .worm, .worm i, .worm b { animation: none; } }
  .feed { width: 100%; border-radius: 6px; background: #000; display: block; aspect-ratio: 16 / 9; object-fit: contain; }
  .group { display: grid; gap: 8px; margin-bottom: 20px; }
  button { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px;
           background: #fff; color: var(--fg); cursor: pointer; text-align: left; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { color: var(--muted); cursor: default; }
  .primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .stop { color: #a33; }
  .status { font-size: 13px; color: var(--muted); min-height: 1.4em; }
  .text { margin-top: 16px; font-size: 14px; max-height: 140px; overflow: auto; }
  a { color: var(--accent); font-size: 13px; }
  @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <section>
    <div class="brand" id="brand">
      <h1>Bookworm</h1>
      <span class="worm" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></span>
    </div>
    <img class="feed" src="/feed" alt="Live camera">
    <p class="text" id="text"></p>
  </section>
  <aside>
    <div class="group">
      <button class="primary" data-do="flip_read">Flip + Read</button>
      <button class="primary" data-do="flip_scan">Flip + Scan</button>
      <button disabled title="Coming later">Flip + Summarise</button>
    </div>
    <div class="group">
      <button data-do="flip">Flip</button>
      <button data-do="read">Read</button>
      <button data-do="scan">Scan</button>
    </div>
    <div class="group">
      <button class="stop" id="stop">Stop</button>
    </div>
    <div class="status" id="status">Ready</div>
    <a id="pdf" href="/book.pdf" target="_blank" hidden>Open scan PDF</a>
  </aside>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  $("brand").style.setProperty("--w", $("brand").offsetWidth + "px");   // crawl the title's width
  const buttons = document.querySelectorAll("[data-do]");
  buttons.forEach((b) => b.onclick = () => fetch("/do/" + b.dataset.do, { method: "POST" }).then(poll));
  $("stop").onclick = () => fetch("/stop", { method: "POST" });
  async function poll() {
    try {
      const s = await (await fetch("/state")).json();
      $("status").textContent = s.status + (s.pages ? ` · ${s.pages} pages scanned` : "");
      $("text").textContent = s.text;
      $("pdf").hidden = !s.pdf;
      buttons.forEach((b) => b.disabled = s.busy);
    } catch (e) { $("status").textContent = "Disconnected"; }
  }
  setInterval(poll, 1000); poll();
</script>
</body>
</html>
